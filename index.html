<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPSの仕組み：公開鍵アイコン入り証明書版</title>
    <style>
        /* --- 共通設定 --- */
        :root {
            --client-color: #3b82f6; --server-color: #10b981; --ca-color: #f59e0b;
            --bg: #f8fafc;
        }
        
        body { 
            font-family: "Hiragino Sans", "Biz UDPGothic", sans-serif; 
            background-color: var(--bg); color: #333; 
            padding: 5px; margin: 0;
            height: 100vh; box-sizing: border-box;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .container { 
            max-width: 100%; margin: 0 auto; width: 100%;
            display: flex; flex-direction: column; height: 100%;
        }

        header { padding: 0; text-align: center; flex-shrink: 0; margin-bottom: 5px;}
        h1 { font-size: 1.8em; margin: 0; line-height: 1.2; }
        .subtitle { font-size: 1em; margin: 0; color: #666; font-weight: bold;}

        /* --- 登場人物エリア --- */
        .stage-top { 
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; 
            margin-bottom: 5px; flex-shrink: 0;
        }
        .person { 
            background: #fff; padding: 5px; border-radius: 8px; 
            border-top: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            text-align: center; position: relative;
        }
        .person.client { border-color: var(--client-color); } 
        .person.server { border-color: var(--server-color); } 
        .person.ca { border-color: var(--ca-color); background: #fffbeb; }
        
        .role { 
            font-weight: 900; display: block; margin-bottom: 2px; 
            font-size: 1.4em; line-height: 1;
        }
        .avatar {
            font-size: 70px; line-height: 1; margin: 5px 0; letter-spacing: -10px;
        }
        
        /* 持ち物リスト */
        .inventory { 
            background: #f1f5f9; border-radius: 6px; padding: 5px; 
            min-height: 80px; 
            text-align: left; margin-top: 0; border: 1px solid #e2e8f0; 
            display: flex; flex-direction: column; gap: 5px; justify-content: center;
        }
        
        .item { 
            background: white; padding: 6px 8px; border-radius: 6px; 
            font-size: 1.3em; font-weight: bold;
            border: 2px solid #cbd5e1; 
            display: flex; align-items: center; justify-content: space-between;
            gap: 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative; transition: all 0.2s;
            line-height: 1.2; box-sizing: border-box;
        }
        
        .item.highlighted {
            border-color: #f59e0b; background-color: #fff7ed;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.7);
            transform: scale(1.05); z-index: 10;
        }

        .secret-key { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
        .note { 
            font-size: 0.85em; font-weight: normal; color: #555; 
            display: inline-block; background: #eee; 
            padding: 2px 6px; border-radius: 4px; vertical-align: middle;
        }
        .secret-key .note { color: #dc2626; background: rgba(255,0,0,0.1); font-weight: bold;}

        /* --- メインアクションエリア --- */
        .main-stage {
            display: flex; gap: 10px; background: #fff; border-radius: 12px; padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); border: 2px solid #ddd; 
            flex: 1; min-height: 300px;
            position: relative; box-sizing: border-box;
        }
        
        .text-side { 
            flex: 0.7; display: flex; flex-direction: column; justify-content: flex-start; 
            padding: 10px 5px; min-width: 0; 
        }
        
        .visual-side { 
            flex: 1.3; position: relative; background: #f8fafc; border-radius: 8px; 
            border: 3px dashed #cbd5e1; overflow: hidden; 
        }
        
        .phase-badge { 
            display: inline-block; padding: 5px 15px; border-radius: 15px; 
            color: white; background: #333; font-size: 1em; margin-bottom: 15px; font-weight: bold;
        }
        
        .msg-box { 
            font-size: 1.4em; font-weight: 800; color: #222; 
            line-height: 1.4; white-space: normal; margin-bottom: 20px;
        }
        
        .def-box {
            background: #fffbeb; border: 2px solid #f59e0b;
            padding: 8px; border-radius: 8px; margin: 10px 0;
            font-size: 0.75em; color: #333; text-align: left;
        }
        
        /* アニメーション要素 */
        .obj { 
            position: absolute; transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; 
        }
        
        .flying-item {
            position: fixed; z-index: 9999; 
            background: white; padding: 10px 20px; border-radius: 10px; 
            border: 3px solid #333; font-weight: bold; font-size: 1.5em;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
            box-sizing: border-box;
        }
        
        .unlocking-motion {
            position: fixed; z-index: 9999; font-size: 80px; 
            transition: all 0.8s ease-in-out; pointer-events: none;
        }

        .hash-val {
            position: absolute; background: #333; color: #fff; padding: 5px 10px;
            border-radius: 5px; font-size: 0.9em; font-family: monospace;
            opacity: 0; transition: all 0.8s; z-index: 50;
        }
        .hash-match {
            background: #22c55e !important; transform: scale(1.5); box-shadow: 0 0 15px #22c55e;
        }

        /* 証明書ウインドウ */
        .cert-win { 
            width: 300px; padding: 15px; background: #fff; border: 5px solid #cbd5e1; border-radius: 15px; 
            z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: border-color 0.5s;
        }
        .cert-seal-container { position: absolute; top: -18px; right: -10px; z-index: 20; }
        .cert-seal { 
            background: var(--ca-color); color: white; padding: 6px 15px; border-radius: 30px; 
            font-size: 1em; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .cert-body { 
            background: #f1f5f9; padding: 10px; border-radius: 8px; margin-top: 10px; 
            filter: blur(5px); opacity: 0.6; transition: 0.8s; border: 2px solid #ddd;
            display: flex; flex-direction: column; align-items: center;
        }
        .cert-body div { font-size: 1.1em; font-weight: bold; } 

        .cert-win.verified { border-color: #22c55e; }
        .cert-seal.verified { background: #22c55e; transform: scale(1.1); }
        .cert-body.unlocked { filter: blur(0); opacity: 1; background: #dcfce7; border-color: var(--server-color); }

        .action-btn { 
            background: #334155; color: white; border: none; padding: 12px 30px; 
            font-size: 1.3em; border-radius: 50px; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); white-space: nowrap; font-weight: 900;
            width: fit-content; align-self: flex-start;
        }
        .action-btn:hover { background: #475569; transform: scale(1.05); }
        .action-btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        @keyframes unlockShake {
            0% { transform: rotate(0deg); } 25% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } 75% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); }
        }
        .shaking { animation: unlockShake 0.4s ease-in-out; }
        @keyframes flash {
            0% { transform: scale(1); background-color: white; }
            50% { transform: scale(1.05); background-color: #fde047; box-shadow: 0 0 10px #fde047; border-color: #eab308; }
            100% { transform: scale(1); background-color: white; }
        }
        .blink { animation: flash 0.6s ease-in-out 3; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HTTPS 通信の仕組み</h1>
        <p class="subtitle">〜署名発行から暗号化通信まで〜</p>
    </header>

    <div class="stage-top">
        <div class="person ca">
            <div class="avatar">🏛️</div>
            <span class="role">認証局</span>
            <div class="inventory" id="inv-ca">
                <div class="item secret-key" id="src-ca-privkey"><span>🗝️ CA秘密鍵</span> <span class="note">厳重保管</span></div>
            </div>
        </div>
        
        <div class="person server">
            <div class="avatar">☁️🗄️</div>
            <span class="role">Webサーバ</span>
            <div class="inventory" id="inv-server">
                <div class="item secret-key" id="src-server-privkey"><span>🗝️ サーバ秘密鍵</span> <span class="note">絶対秘密</span></div>
                <div class="item" id="src-server-pubkey-raw"><span>🔓 サーバ公開鍵</span></div>
            </div>
        </div>
        
        <div class="person client">
            <div class="avatar">📱💻</div>
            <span class="role">あなた(ユーザ)</span>
            <div class="inventory" id="inv-client">
                <div class="item" id="src-ca-pubkey"><span>🛡️ CA公開鍵</span> <span class="note">初期装備</span></div>
            </div>
        </div>
    </div>

    <div class="main-stage">
        <div class="text-side">
            <div><span id="badge" class="phase-badge">Start</span></div>
            <div class="msg-box" id="msg">
                「発行申請」ボタンを<br>押してください。<br><br>
                サーバが認証局(CA)へ<br>公開鍵を送ります。
            </div>
            <button id="btn" class="action-btn" onclick="nextStep()">発行申請 📝</button>
        </div>

        <div class="visual-side" id="visual-area">
            <div id="cert" class="cert-win obj">
                <div class="cert-seal-container">
                    <div class="cert-seal" id="seal">🔒 CAの署名</div>
                </div>
                <div style="font-weight:bold; font-size: 1.3em; margin-bottom:5px;">📜🔓 CA署名つき証明書</div>
                <div id="cert-body" class="cert-body">
                    <div style="font-size:0.8em; color:#666; margin-bottom:5px;">▼ 中身</div>
                    <div style="font-size:50px; margin: 5px;">🔓</div>
                    <div style="font-weight:bold; color:var(--server-color); font-size:1.2em;">サーバの公開鍵</div>
                    <div style="font-size:0.8em; color:#666;">発行元: 認証局(CA)</div>
                </div>
            </div>
            
            <div id="common-key" class="obj" style="font-size:150px;">🔑</div>
            <div id="using-key" class="obj" style="font-size:100px; color:var(--server-color);">🔓</div>
            <div id="capsule" class="obj" style="font-size:140px;">💊</div>

            <div id="hash-decrypted" class="hash-val" style="top:20%; left:70%;">#️⃣正解ハッシュ(復号)</div>
            <div id="hash-calc" class="hash-val" style="top:50%; left:70%;">#️⃣計算ハッシュ(原紙)</div>
        </div>
    </div>
</div>

<script>
    let step = 0;
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const badge = document.getElementById('badge');

    function highlightItem(itemId) {
        const item = document.getElementById(itemId);
        if (item) item.classList.add('highlighted');
    }

    function unhighlightItem(itemId) {
        const item = document.getElementById(itemId);
        if (item) item.classList.remove('highlighted');
    }

    // アイテム移動関数
    function transferItem(sourceItemId, destContainerId, contentHtml, iconChar, callback, newItemId = null) {
        const sourceElem = document.getElementById(sourceItemId); 
        const destContainer = document.getElementById(destContainerId);
        
        const placeholder = document.createElement('div');
        placeholder.className = 'item'; 
        placeholder.style.visibility = 'hidden'; 
        placeholder.style.opacity = '0';
        placeholder.innerHTML = `${iconChar} <span>${contentHtml}</span> <span class="note" style="color:#1d4ed8; font-weight:bold">New!</span>`;
        destContainer.appendChild(placeholder);

        const startRect = sourceElem.getBoundingClientRect();
        const endRect = placeholder.getBoundingClientRect();

        const flyer = document.createElement('div');
        flyer.className = 'flying-item'; 
        flyer.innerHTML = `${iconChar} <span>${contentHtml}</span>`; 
        flyer.style.border = "2px solid #333";

        flyer.style.left = startRect.left + 'px';
        flyer.style.top = startRect.top + 'px';
        flyer.style.width = startRect.width + 'px';
        flyer.style.height = startRect.height + 'px';
        
        document.body.appendChild(flyer);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                flyer.style.left = endRect.left + 'px';
                flyer.style.top = endRect.top + 'px';
                flyer.style.width = endRect.width + 'px';
                flyer.style.height = endRect.height + 'px';
            });
        });

        setTimeout(() => {
            flyer.remove(); 
            placeholder.remove();
            
            const newItem = document.createElement('div');
            newItem.className = 'item blink';
            if (newItemId) newItem.id = newItemId;
            newItem.innerHTML = `${iconChar} <span>${contentHtml}</span> <span class="note" style="color:#1d4ed8; font-weight:bold">New!</span>`;
            destContainer.appendChild(newItem);

            if (callback) callback();
        }, 1000);
    }

    function nextStep() {
        step++;
        btn.disabled = true;

        // --- Step 1: 発行申請 ---
        if (step === 1) {
            badge.innerText = "Step 0: 証明書の発行申請";
            badge.style.background = "#f59e0b"; // CA色
            msg.innerHTML = "サーバが認証局(CA)へ<br><b>「サーバ公開鍵🔓」</b>を<br>提出します。";

            transferItem('src-server-pubkey-raw', 'inv-ca', 'サーバ公開鍵', '🔓', () => {
                document.getElementById('src-server-pubkey-raw').remove();
                
                msg.innerHTML = "認証局(CA)は、<br>預かった鍵を<b>「証明書の原紙📄🔓」</b>にし<br><b>「CA秘密鍵」</b>で署名します。";
                
                const caInv = document.getElementById('inv-ca');
                caInv.lastChild.remove(); 
                
                const draftItem = document.createElement('div');
                draftItem.className = 'item';
                draftItem.id = 'draft-cert';
                draftItem.innerHTML = `📄🔓 <span>証明書の原紙</span> <span class="note">未署名</span>`;
                caInv.appendChild(draftItem);

                setTimeout(() => {
                    highlightItem('src-ca-privkey');
                    
                    setTimeout(() => {
                        unhighlightItem('src-ca-privkey');
                        draftItem.innerHTML = `📜🔓 <span>CA署名つき証明書</span> <span class="note" style="color:#d97706; font-weight:bold">Signed</span>`;
                        draftItem.classList.add('blink');
                        draftItem.id = 'signed-cert';

                        btn.innerText = "サーバへ送る 📨";
                        btn.disabled = false;
                    }, 1000);
                }, 800);
            });
        }

        // --- Step 2: 発行完了 ---
        else if (step === 2) {
            badge.innerText = "Step 0: 発行完了";
            msg.innerHTML = "<b>「CA署名つき証明書📜🔓」</b>が<br>認証局からサーバへ<br>発行されました。";

            transferItem('signed-cert', 'inv-server', 'CA署名つき証明書', '📜🔓', () => {
                document.getElementById('signed-cert').remove();
                
                const serverInv = document.getElementById('inv-server');
                serverInv.lastChild.id = 'src-cert-item';

                msg.innerHTML = "これで準備完了です。<br><b>「接続開始」</b>を押すと<br>ユーザとの通信が始まります。";
                btn.innerText = "接続開始 🚀";
                btn.disabled = false;
            });
        }

        // --- Step 3: 送信 ---
        else if (step === 3) {
            badge.innerText = "Step 1: 証明書の提示";
            badge.style.background = "#10b981";
            msg.innerHTML = "サーバがユーザへ、<br><b>「CA署名つき証明書」</b>を<br>送信しました。";

            transferItem('src-cert-item', 'inv-client', 'CA署名つき証明書', '📜🔓', () => {
                msg.innerHTML = `
                    証明書を受信しました。<br>
                    <div class="def-box">
                    <b>【CA署名つき証明書】</b><br>
                    ＝ <b>証明書(原紙)</b><br>
                    ＋ <b>署名(CA秘密鍵での暗号文)</b>
                    </div>
                `;
                
                const cert = document.getElementById('cert');
                cert.style.transform = "translate(-50%, -50%) scale(1)";
                cert.style.opacity = "1";
                
                btn.innerText = "検証して開ける 🔍";
                btn.disabled = false;
            });
        }

        // --- Step 4: 検証 (ハッシュ比較) ---
        else if (step === 4) {
            badge.innerText = "Step 2: 証明書の検証";
            badge.style.background = "#3b82f6";
            msg.innerHTML = "端末内の<br><b>「CA公開鍵🛡️」</b>で<br>署名を検証（復号）し<br>ハッシュ値を比較します。";

            const sourceKeyId = 'src-ca-pubkey';
            const sourceKey = document.getElementById(sourceKeyId);
            const targetSeal = document.getElementById('seal');

            highlightItem(sourceKeyId);

            const keyAnim = document.createElement('div');
            keyAnim.className = 'unlocking-motion';
            keyAnim.innerHTML = '🛡️';
            const startRect = sourceKey.getBoundingClientRect();
            keyAnim.style.left = startRect.left + 'px'; keyAnim.style.top = startRect.top + 'px';
            document.body.appendChild(keyAnim);

            setTimeout(() => {
                const sealRect = targetSeal.getBoundingClientRect();
                keyAnim.style.left = (sealRect.left - 20) + 'px';
                keyAnim.style.top = sealRect.top + 'px';
                keyAnim.style.transform = "scale(1.2)";
            }, 50);

            setTimeout(() => {
                targetSeal.classList.add('shaking'); 
                
                setTimeout(() => {
                    const hashDec = document.getElementById('hash-decrypted');
                    const hashCalc = document.getElementById('hash-calc');
                    
                    hashDec.style.opacity = 1;
                    targetSeal.style.opacity = 0; 
                    keyAnim.style.opacity = 0;
                    
                    hashCalc.style.opacity = 1;
                    
                    setTimeout(() => {
                        hashDec.style.top = "35%"; hashDec.style.left = "30%";
                        hashCalc.style.top = "35%"; hashCalc.style.left = "60%";
                        
                        setTimeout(() => {
                            hashDec.style.left = "45%";
                            hashCalc.style.left = "45%";
                            
                            setTimeout(() => {
                                hashCalc.style.opacity = 0;
                                hashDec.innerHTML = "✅ 一致 (改ざんなし)";
                                hashDec.classList.add('hash-match');
                                
                                document.getElementById('cert').classList.add('verified');
                                document.getElementById('cert-body').classList.add('unlocked');
                                unhighlightItem(sourceKeyId);
                                
                                msg.innerHTML = "<b>ハッシュ値が一致！</b><br>改ざんされていないため<br><b>「サーバ公開鍵🔓」</b>は<br>本物だと証明されました。";

                                const invClient = document.getElementById('inv-client');
                                const keyItem = document.createElement('div');
                                keyItem.className = "item blink";
                                keyItem.id = 'src-server-pubkey'; 
                                keyItem.innerHTML = "🔓 <span>サーバ公開鍵</span> <span class='note'>(Get!)</span>";
                                invClient.appendChild(keyItem);

                                btn.innerText = "セッション鍵を作成 🔑";
                                btn.disabled = false;
                                
                                setTimeout(() => {
                                    hashDec.style.opacity = 0; 
                                }, 1500);

                            }, 600);
                        }, 800);
                    }, 800);
                }, 600);
            }, 900);
        }

        // --- Step 5: セッション鍵生成 ---
        else if (step === 5) {
            badge.innerText = "Step 3: 共通鍵の生成";
            msg.innerHTML = "通信を暗号化するため、<br>ユーザ（あなた）が<br><b>「セッション鍵🔑」</b>を<br>生成しました。";
            
            document.getElementById('cert').style.opacity = "0"; 
            const commonKey = document.getElementById('common-key');
            commonKey.style.opacity = "1";
            commonKey.style.transform = "translate(-50%, -50%) scale(1)";

            const invClient = document.getElementById('inv-client');
            const sessionItem = document.createElement('div');
            sessionItem.className = "item blink"; 
            sessionItem.id = "src-session-item"; 
            sessionItem.innerHTML = '🔑 <span>セッション鍵</span> <span class="note">(New!)</span>';
            invClient.appendChild(sessionItem);

            btn.innerText = "暗号化して送信 💊";
            btn.disabled = false;
        }

        // --- Step 6: 暗号化と送信 ---
        else if (step === 6) {
            badge.innerText = "Step 4: 暗号化と送信";
            msg.innerHTML = "<b>「セッション鍵🔑」</b>を<br><b>「サーバ公開鍵🔓」</b>で<br>暗号化して送信します。";

            highlightItem('src-session-item');
            highlightItem('src-server-pubkey');

            const commonKey = document.getElementById('common-key');
            const usingKey = document.getElementById('using-key');
            const capsule = document.getElementById('capsule');

            usingKey.style.opacity = "1";
            usingKey.style.transform = "translate(100px, -50%)"; 
            
            setTimeout(() => {
                usingKey.style.transition = "transform 0.5s ease-out";
                usingKey.style.transform = "translate(-50%, -50%)"; 
                
                setTimeout(() => {
                    commonKey.style.transform = "translate(-50%, -50%) scale(0)";
                    usingKey.style.transform = "translate(-50%, -50%) scale(0.5)"; 
                    usingKey.style.opacity = "0";
                    capsule.style.transform = "translate(-50%, -50%) scale(1.2)";
                    capsule.style.opacity = "1"; 

                    unhighlightItem('src-session-item');
                    unhighlightItem('src-server-pubkey');
                    const userKey = document.getElementById('src-session-item');
                    userKey.innerHTML = '🔑 <span>セッション鍵</span> <span class="note" style="color:#666;">(共有中)</span>';

                    setTimeout(() => {
                        msg.innerHTML = "暗号化されたカプセルが<br>ユーザからサーバへ<br>送信されます。";
                        capsule.style.opacity = "0"; 
                        transferItem('capsule', 'inv-server', 'カプセル(暗号文)', '💊', () => {
                            msg.innerHTML = "サーバに到着。<br><br>サーバはこれを<br>「秘密鍵」で復号します。";
                            btn.innerText = "サーバで復号 🗝️";
                            btn.disabled = false;
                        }, 'dest-capsule');
                    }, 1000);
                }, 600);
            }, 100);
        }

        // --- Step 7: 復号と完了 ---
        else if (step === 7) {
            badge.innerText = "Final: 復号と通信確立"; badge.style.background = "#333";
            msg.innerHTML = "サーバは届いた<br><b>「カプセル💊」</b>を、<br><b>「サーバ秘密鍵🗝️」</b>で<br>復号します。";

            const privKeyId = 'src-server-privkey';
            const capsuleId = 'dest-capsule';
            highlightItem(privKeyId);
            highlightItem(capsuleId);

            const capsule = document.getElementById('capsule');
            capsule.style.opacity = "1"; capsule.style.transform = "translate(-50%, -50%) scale(1)";

            const keyAnim = document.createElement('div');
            keyAnim.className = 'unlocking-motion';
            keyAnim.innerHTML = '🗝️';
            const privKeyElem = document.getElementById(privKeyId);
            const startRect = privKeyElem.getBoundingClientRect();
            keyAnim.style.left = startRect.left + 'px'; keyAnim.style.top = startRect.top + 'px';
            document.body.appendChild(keyAnim);

            setTimeout(() => {
                const capsuleRect = capsule.getBoundingClientRect();
                keyAnim.style.left = (capsuleRect.left + 20) + 'px';
                keyAnim.style.top = (capsuleRect.top + 20) + 'px';
            }, 50);

            setTimeout(() => {
                capsule.classList.add('shaking');
                setTimeout(() => {
                    capsule.style.transform = "translate(-50%, -50%) scale(1.5)"; capsule.style.opacity = "0";
                    keyAnim.style.opacity = "0";
                    
                    const commonKey = document.getElementById('common-key');
                    commonKey.style.transform = "translate(-50%, -50%) scale(1)"; commonKey.style.opacity = "1";

                    unhighlightItem(privKeyId);
                    unhighlightItem(capsuleId);
                    document.getElementById(capsuleId).remove();

                    const invServer = document.getElementById('inv-server');
                    const finalItem = document.createElement('div');
                    finalItem.className = "item blink";
                    finalItem.innerHTML = '🔑 <span>セッション鍵</span> <span class="note">共有完了</span>';
                    invServer.appendChild(finalItem);
                    
                    const userKey = document.getElementById('src-session-item');
                    userKey.classList.add('blink');
                    userKey.innerHTML = '🔑 <span>セッション鍵</span> <span class="note" style="color:#10b981; font-weight:bold;">共有完了</span>';

                    msg.innerHTML = "復号成功！<br>鍵を共有できました。<br><br>このセッション鍵で<br>Web通信の<br>暗号化/復号を行います。";
                    document.getElementById('visual-area').innerHTML = '<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:2.5em; font-weight:900; color:#10b981; width:100%; text-align:center;">🤝 暗号化通信の確立<br><span style="font-size:0.6em; color:#555;">(HTTPS通信開始)</span></div>';
                    btn.style.display = "none";
                    setTimeout(() => keyAnim.remove(), 500);
                }, 800);
            }, 800);
        }
    }
</script>
</body>
</html>
